name: Bug report
description: Something routes or counts wrongly
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you expected and what you saw instead.
    validations:
      required: true
  - type: textarea
    id: budget
    attributes:
      label: The status bar text and any budget-router notice
      description: Copy the line under the prompt (route, day, 5h, week) and the notice text. Remove anything private first.
      render: text
  - type: input
    id: cc
    attributes:
      label: Claude Code version
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: Operating system
  - type: input
    id: ver
    attributes:
      label: budget-router version
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce